<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React 18 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { 
            background-color: black; 
            margin: 0; 
            /* iOS Fix: Use dynamic viewport height */
            min-height: 100dvh; 
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* iOS Fix: prevent rubber-banding */
            overscroll-behavior: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion } = window.Motion || window.FramerMotion;

        // EMBEDDED ICON: Gold Gradient
        const GENERATED_ICON = "https://zenova.sbs/images/maya-logo.png";

        const SplashScreen = () => {
            const [step, setStep] = useState(0);

            useEffect(() => {
                const t1 = setTimeout(() => setStep(1), 500);
                const t2 = setTimeout(() => setStep(2), 2500);
                return () => { clearTimeout(t1); clearTimeout(t2); };
            }, []);

            const infinityPath = "M100,100 C145,60 190,60 190,100 C190,140 145,140 100,100 C55,60 10,60 10,100 C10,140 55,140 100,100 Z";
            const iconPath = "M100,40 C150,40 160,50 160,100 C160,150 150,160 100,160 C50,160 40,150 40,100 C40,50 50,40 100,40 Z";

            return (
                <div className="relative w-80 h-80 flex items-center justify-center">
                    <svg
                        viewBox="0 0 200 200"
                        className="w-full h-full"
                        // Ensure filters work by referencing ID in same context
                        style={{ filter: "url(#neonGlow)" }}
                    >
                        <defs>
                            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stopColor="#D4AF37" />
                                <stop offset="50%" stopColor="#F9E29C" />
                                <stop offset="100%" stopColor="#D4AF37" />
                            </linearGradient>

                            <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
                                <feGaussianBlur stdDeviation="3" result="coloredBlur" />
                                <feMerge>
                                    <feMergeNode in="coloredBlur" />
                                    <feMergeNode in="SourceGraphic" />
                                </feMerge>
                            </filter>

                            {/* IOS FIX: Explicit ClipPath definition */}
                            <clipPath id="iconClip">
                                <path d={iconPath} />
                            </clipPath>
                        </defs>

                        {/* LAYER 1: The Image */}
                        <motion.image
                            href={GENERATED_ICON} 
                            // IOS FIX: Add xlinkHref for compatibility
                            xlinkHref={GENERATED_ICON}
                            x="40"
                            y="40"
                            width="120"
                            height="120"
                            preserveAspectRatio="xMidYMid slice"
                            initial={{ opacity: 0 }}
                            animate={{ opacity: step >= 2 ? 1 : 0 }}
                            transition={{ duration: 1.0, ease: "linear" }}
                            // IOS FIX: Reference the clipPath ID
                            clipPath="url(#iconClip)" 
                        />

                        {/* LAYER 2: The Stroke */}
                        <motion.path
                            d={step >= 2 ? iconPath : infinityPath}
                            stroke="url(#goldGradient)"
                            strokeWidth="3"
                            fill="transparent"
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            initial={{ pathLength: 0 }}
                            animate={{
                                pathLength: step >= 1 ? 1 : 0,
                                d: step >= 2 ? iconPath : infinityPath,
                            }}
                            transition={{
                                pathLength: { duration: 1.5, ease: "easeInOut" },
                                d: { duration: 1.0, ease: [0.4, 0, 0.2, 1] }, 
                            }}
                        />
                    </svg>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SplashScreen />);
    </script>
</body>
</html>
