<head>

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#0b0b0c">
    <meta name="description"
        content="Mayalogy - Personal astrology reading for kundli, numerology, Lal Kitab insights, timing, and mindful routines">
    <title>Mayalogy - Personal Astrology Reading</title>

    <link rel="manifest" href="/manifest.json">

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="/css/maya.css?v=20260909-compass-preload-poppins" rel="stylesheet">

    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.png">

    <!-- Preload language-choice voice prompt so it's already on the device when onboarding opens -->
    <link rel="preload" as="audio" href="/Language-choice.mp3" type="audio/mpeg">
    <link rel="preload" as="image" href="/background.jpeg" type="image/jpeg" fetchpriority="high">
    <link rel="preload" as="image" href="/compass-black-background_1063-119.avif" type="image/avif">
    <link rel="preload" as="image" href="/19-194340_compass-needle-png-circle.png" type="image/png">
</head>

<body>
    <div id="root"></div>

    <script>
        if ('serviceWorker' in navigator || 'caches' in window) {
            window.addEventListener('load', async () => {
                try {
                    const buildStamp = '20260909-compass-preload-poppins';
                    const hadController = !!navigator.serviceWorker?.controller;

                    const localCacheKeyPatterns = [
                        /translation_cache/i,
                        /stmt_cache/i
                    ];

                    Object.keys(localStorage).forEach((key) => {
                        if (localCacheKeyPatterns.some((pattern) => pattern.test(key))) {
                            localStorage.removeItem(key);
                        }
                    });

                    if ('serviceWorker' in navigator) {
                        const registrations = await navigator.serviceWorker.getRegistrations();
                        await Promise.all(registrations.map((registration) => registration.unregister()));
                    }

                    if ('caches' in window) {
                        const cacheNames = await caches.keys();
                        await Promise.all(cacheNames.map((name) => caches.delete(name)));
                    }

                    const currentBuild = localStorage.getItem('maya-network-only-build');
                    const needsReload = hadController || currentBuild !== buildStamp;

                    if (needsReload && !sessionStorage.getItem('maya-network-only-reloaded')) {
                        sessionStorage.setItem('maya-network-only-reloaded', 'true');
                        localStorage.setItem('maya-network-only-build', buildStamp);
                        window.location.reload();
                        return;
                    }

                    sessionStorage.removeItem('maya-network-only-reloaded');
                    localStorage.setItem('maya-network-only-build', buildStamp);
                    console.log('🌐 Network-only mode active');
                } catch (error) {
                    console.error('❌ Failed to enforce network-only mode:', error);
                }
            });
        }
    </script>

    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
