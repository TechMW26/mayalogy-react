name: Mayalogy
options:
  bundleIdPrefix: com.maya
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

settings:
  base:
    DEVELOPMENT_TEAM: 37R3XLT7BG
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic

targets:
  Mayalogy:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Mayalogy
    resources:
      - path: Mayalogy/Resources
        optional: true
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    info:
      path: Mayalogy/Info.plist
      properties:
        CFBundleDisplayName: Mayalogy
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "4"
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIBackgroundModes:
          - remote-notification
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsArbitraryLoadsInWebContent: true
        NSCameraUsageDescription: Mayalogy uses the camera so you can capture photos for
          Vastu room scanning, profile pictures, and palm/face analysis.
        NSPhotoLibraryUsageDescription: Mayalogy needs access to your photo library so
          you can upload existing pictures for Vastu, profile, and scan
          features.
        NSPhotoLibraryAddUsageDescription: Mayalogy can save generated images and
          summaries to your photo library when you choose to download them.
        NSMicrophoneUsageDescription: Mayalogy uses the microphone for voice-based
          questions and coaching with MAYA.
        NSLocationWhenInUseUsageDescription: Mayalogy uses your location to personalize
          timing, Vastu, and location-aware guidance.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maya.astrology
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        CODE_SIGN_ENTITLEMENTS: Mayalogy/Mayalogy.entitlements
        GENERATE_INFOPLIST_FILE: NO
