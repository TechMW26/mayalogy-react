name: Mayalogy
options:
  bundleIdPrefix: com.maya
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic

targets:
  Mayalogy:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Mayalogy
    resources:
      - path: Mayalogy/Resources
        optional: true
    info:
      path: Mayalogy/Info.plist
      properties:
        CFBundleDisplayName: Mayalogy
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIBackgroundModes:
          - remote-notification
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsArbitraryLoadsInWebContent: true
        NSCameraUsageDescription: Mayalogy uses the camera so you can capture photos for
          Vastu room scanning, profile pictures, and palm/face analysis.
        NSPhotoLibraryUsageDescription: Mayalogy needs access to your photo library so
          you can upload existing pictures for Vastu and astrology features.
        NSPhotoLibraryAddUsageDescription: Mayalogy can save generated charts and images
          to your photo library when you choose to download them.
        NSMicrophoneUsageDescription: Mayalogy uses the microphone for voice-based
          questions to your astrologer.
        NSLocationWhenInUseUsageDescription: Mayalogy uses your location to personalize
          Vastu and astrology results based on your geographical position.
        NSUserTrackingUsageDescription: Mayalogy uses this to deliver more relevant
          horoscope content; you can change this anytime in Settings.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maya.astrology
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        GENERATE_INFOPLIST_FILE: NO
